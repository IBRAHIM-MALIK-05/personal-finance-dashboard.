{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="flashes">
  {% for cat, msg in messages %}
  <div class="flash flash-{{ cat }}" role="{{ 'alert' if cat == 'error' else 'status' }}">
    <span class="flash-icon" aria-hidden="true">{{ {'success': '✓', 'error': '!', 'info': 'i'}.get(cat, 'i') }}</span>
    <span>{% if cat == 'error' %}<span class="sr-only">Error: </span>{% endif %}{{ msg }}</span>
  </div>
  {% endfor %}
</div>
{% endif %}
{% endwith %}
